<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13233f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YMT Port">
<link rel="manifest" href="/port-manifest.webmanifest">
<link rel="icon" href="/icons/port-192.png">
<link rel="apple-touch-icon" href="/icons/port-192.png">
<title>YMT Port — Sorties de camions</title>
<style>
  :root {
    --navy: #13233f; --navy-2: #1d3157; --ink: #111a2b; --muted: #5b6578; --line: #dde2ea;
    --paper: #eef1f5; --card: #ffffff; --amber: #d97706; --amber-soft: #fff4e0; --amber-ink: #8a4b02;
    --green: #157a3c; --green-soft: #e3f4ea; --red: #b42318; --red-soft: #fde8e6; --blue-soft: #e4e9f2;
    --r: 14px; --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100dvh; padding-bottom: calc(96px + var(--safe-b)); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* ── barre du haut ── */
  .top { position: sticky; top: 0; z-index: 20; background: var(--navy); color: #fff; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 12px; display: flex; align-items: center; gap: 12px; }
  .top h1 { font-size: 17px; margin: 0; font-weight: 750; letter-spacing: -.2px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top small { display: block; font-size: 12.5px; font-weight: 500; color: #b8c3d6; }
  .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--amber); color: var(--navy); display: grid; place-items: center; font-weight: 900; font-size: 13px; flex: none; }
  .icon-btn { width: 42px; height: 42px; border-radius: 11px; border: 0; background: rgba(255,255,255,.1); color: #fff; display: grid; place-items: center; flex: none; cursor: pointer; }
  .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .net { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 99px; background: rgba(255,255,255,.12); color: #d6deea; white-space: nowrap; }
  .net.off { background: var(--amber); color: var(--navy); }

  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 15px; margin: 22px 2px 10px; color: var(--muted); font-weight: 700; }

  /* ── cartes ── */
  .card { background: var(--card); border-radius: var(--r); padding: 16px; border: 1px solid var(--line); }
  .today { border: 0; background: var(--navy); color: #fff; padding: 20px; }
  .today .k { color: #b8c3d6; font-size: 14px; }
  .today .big { font-size: 24px; font-weight: 800; margin: 2px 0 14px; letter-spacing: -.4px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .stats div { background: rgba(255,255,255,.08); border-radius: 10px; padding: 9px 10px; }
  .stats b { display: block; font-size: 17px; white-space: nowrap; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 12px; color: #b8c3d6; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; white-space: nowrap; border-radius: 13px; border: 0; font-weight: 750; font-size: 16.5px; cursor: pointer; padding: 0 16px; }
  .btn svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .btn-amber { background: var(--amber); color: #fff; }
  .btn-navy { background: var(--navy); color: #fff; }
  .btn-ghost { background: var(--blue-soft); color: var(--navy); }
  .btn-danger { background: var(--red-soft); color: var(--red); }
  .btn:disabled { opacity: .55; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .sheet-item { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 8px; cursor: pointer; width: 100%; text-align: left; }
  .sheet-item .t { flex: 1; min-width: 0; }
  .sheet-item b { display: block; font-size: 15.5px; }
  .sheet-item span { font-size: 13.5px; color: var(--muted); }
  .chip { font-size: 12.5px; font-weight: 750; padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
  .chip.brouillon { background: var(--amber-soft); color: var(--amber-ink); }
  .chip.soumis { background: var(--blue-soft); color: var(--navy); }
  .chip.valide { background: var(--green-soft); color: var(--green); }

  /* ── fiche : lignes camion ── */
  .summary { display: grid; grid-template-columns: .8fr .95fr 1.15fr 1.1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin-bottom: 14px; }
  .summary div { background: var(--card); padding: 10px 6px; text-align: center; }
  .summary b { display: block; font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
  .summary span { font-size: 11.5px; color: var(--muted); }
  .exit { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 10px; display: block; width: 100%; text-align: left; cursor: pointer; }
  .exit.pending { border-style: dashed; border-color: var(--amber); }
  .exit .l1 { display: flex; align-items: baseline; gap: 10px; }
  .exit .time { font-weight: 800; color: var(--amber-ink); font-variant-numeric: tabular-nums; }
  .exit .truck { font-weight: 800; font-size: 17px; }
  .exit .who { margin-left: auto; font-size: 14px; color: var(--muted); text-align: right; }
  .exit .ctn { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 700; font-size: 15px; letter-spacing: .3px; margin-top: 6px; }
  .exit .dest { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .exit .money { display: flex; gap: 14px; margin-top: 8px; font-size: 13.5px; }
  .exit .money b { font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; font-size: 12px; font-weight: 750; padding: 2px 8px; border-radius: 6px; margin: 6px 6px 0 0; }
  .tag.ex { background: var(--amber-soft); color: var(--amber-ink); }
  .tag.ext { background: var(--blue-soft); color: var(--navy); }
  .tag.ok { background: var(--green-soft); color: var(--green); }
  .tag.no { background: var(--red-soft); color: var(--red); }
  .warn { margin-top: 8px; font-size: 13px; color: var(--amber-ink); background: var(--amber-soft); padding: 7px 10px; border-radius: 9px; }
  .empty { text-align: center; padding: 34px 18px; color: var(--muted); }
  .empty svg { width: 54px; height: 54px; stroke: #a8b2c3; fill: none; stroke-width: 1.6; }
  .empty p { margin: 8px 0 0; }

  /* ── barre d'action basse ── */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(238,241,245,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + var(--safe-b)); }
  .dock-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  .dock .btn { min-height: 56px; }
  .dock .send { width: auto; padding: 0 16px; }
  .dock .btn { font-size: 16px; padding: 0 12px; }
  .form-dock .row-2 { grid-template-columns: 1.15fr .85fr; }
  .form-dock .btn { font-size: 15.5px; padding: 0 10px; }

  /* ── formulaire plein écran ── */
  .panel { position: fixed; inset: 0; z-index: 50; background: var(--paper); overflow-y: auto; transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); }
  .panel.open { transform: none; }
  @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
  .panel main { padding-bottom: calc(120px + var(--safe-b)); }
  .field { margin-bottom: 14px; }
  .field > label, .lbl { display: block; font-size: 14px; font-weight: 700; color: var(--ink); margin: 0 0 6px 2px; }
  .field .hint { font-size: 13px; color: var(--muted); margin: 5px 2px 0; }
  .in { width: 100%; min-height: 52px; border: 1.5px solid #c9d0db; border-radius: 12px; background: #fff; padding: 12px 14px; font-size: 17px; }
  .in:focus { border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px rgba(19,35,63,.12); }
  select.in { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 23px, calc(100% - 14px) 23px; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .5px; text-transform: uppercase; }
  textarea.in { min-height: 84px; resize: vertical; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #dfe4ec; border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { min-height: 46px; border: 0; border-radius: 9px; background: transparent; font-weight: 750; color: var(--muted); cursor: pointer; }
  .seg button.on { background: #fff; color: var(--navy); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .group { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 14px 4px; margin-bottom: 14px; }
  .group h3 { font-size: 13px; color: var(--muted); margin: 0 0 12px 2px; font-weight: 750; }
  .note { font-size: 14px; border-radius: 10px; padding: 10px 12px; margin: -4px 0 14px; }
  .note.ex { background: var(--amber-soft); color: var(--amber-ink); }
  .note.info { background: var(--blue-soft); color: var(--navy); }
  .ctn-state { font-size: 13.5px; font-weight: 700; margin: 6px 2px 0; }
  .ctn-state.ok { color: var(--green); } .ctn-state.bad { color: var(--red); } .ctn-state.warn { color: var(--amber-ink); }
  .money-in { position: relative; }
  .money-in::after { content: "FCFA"; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 700; color: var(--muted); }
  .money-in .in { padding-right: 60px; font-variant-numeric: tabular-nums; }
  .form-dock { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(238,241,245,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + var(--safe-b)); z-index: 60; }
  .form-dock .in2 { max-width: 640px; margin: 0 auto; display: grid; gap: 8px; }

  /* ── login ── */
  .login { min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--navy); }
  .login .card { width: 100%; max-width: 380px; padding: 26px 22px; }
  .login .mark { width: 52px; height: 52px; font-size: 19px; border-radius: 14px; margin-bottom: 14px; }
  .login h1 { margin: 0 0 4px; font-size: 22px; }
  .login p { margin: 0 0 20px; color: var(--muted); }
  .err { background: var(--red-soft); color: var(--red); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; margin-bottom: 12px; }

  /* ── toast & dialog ── */
  .toast { position: fixed; left: 50%; bottom: calc(100px + var(--safe-b)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 15px; z-index: 90; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .toast.bad { background: var(--red); }
  .dialog { position: fixed; inset: 0; z-index: 80; background: rgba(10,18,32,.55); display: grid; align-items: end; }
  .dialog .box { background: #fff; border-radius: 20px 20px 0 0; padding: 22px 18px calc(18px + var(--safe-b)); max-width: 640px; width: 100%; margin: 0 auto; }
  .dialog h3 { margin: 0 0 6px; font-size: 19px; }
  .dialog p { margin: 0 0 16px; color: var(--muted); }
  .dialog .actions { display: grid; gap: 8px; }
  .menu-list button { width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; min-height: 54px; border: 0; background: none; font-size: 16.5px; font-weight: 600; border-bottom: 1px solid var(--line); cursor: pointer; padding: 0 4px; }
  .menu-list button:last-child { border: 0; }
  .menu-list svg { width: 22px; height: 22px; stroke: var(--navy); fill: none; stroke-width: 2; }
  .menu-list .danger { color: var(--red); } .menu-list .danger svg { stroke: var(--red); }
</style>
</head>
<body>

<!-- ═════════ CONNEXION ═════════ -->
<section id="v-login" class="login hidden">
  <form class="card" id="login-form" autocomplete="on">
    <div class="mark">YM</div>
    <h1>Sorties port</h1>
    <p>Connectez-vous avec le compte que le bureau vous a donné.</p>
    <div id="login-err" class="err hidden"></div>
    <div class="field"><label for="lg-user">Nom d'utilisateur</label><input id="lg-user" class="in" autocapitalize="none" autocomplete="username" required></div>
    <div class="field"><label for="lg-pass">Mot de passe</label><input id="lg-pass" class="in" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-amber" type="submit">Se connecter</button>
  </form>
</section>

<!-- ═════════ ACCUEIL ═════════ -->
<section id="v-home" class="hidden">
  <div class="top">
    <div class="mark">YM</div>
    <h1><span id="home-hello">Bonjour</span><small id="home-date"></small></h1>
    <span class="net" id="net-home">En ligne</span>
    <button class="icon-btn" id="btn-logout" aria-label="Se déconnecter"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
  </div>
  <main>
    <div id="today-card"></div>
    <h2>Mes fiches récentes</h2>
    <div id="sheet-list"></div>
  </main>
</section>

<!-- ═════════ FICHE ═════════ -->
<section id="v-sheet" class="hidden">
  <div class="top">
    <button class="icon-btn" id="btn-back" aria-label="Retour"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <h1><span id="sh-title">Fiche</span><small id="sh-sub"></small></h1>
    <span class="net" id="net-sheet">En ligne</span>
    <button class="icon-btn" id="btn-menu" aria-label="Plus d'actions"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
  </div>
  <main>
    <div id="sh-status-note"></div>
    <div class="summary" id="sh-summary"></div>
    <div id="sh-rows"></div>
  </main>
  <div class="dock" id="sh-dock">
    <div class="dock-in">
      <button class="btn btn-amber" id="btn-add"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Ajouter un camion</button>
      <button class="btn btn-navy send" id="btn-send"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Envoyer</button>
    </div>
  </div>
</section>

<!-- ═════════ FORMULAIRE SORTIE ═════════ -->
<section id="v-form" class="panel" aria-hidden="true">
  <div class="top">
    <button class="icon-btn" id="f-close" aria-label="Fermer"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <h1 id="f-title">Nouveau camion sorti</h1>
  </div>
  <main>
    <form id="row-form" autocomplete="off">
      <div class="group">
        <h3>Camion</h3>
        <div class="field"><div class="seg" id="f-owner"><button type="button" data-v="0" class="on">YM-TRANSIT</button><button type="button" data-v="1">Externe</button></div></div>
        <div id="f-ymt">
          <div class="field"><label for="f-truck">Camion</label><select id="f-truck" class="in"></select></div>
        </div>
        <div id="f-ext" class="hidden">
          <div class="field"><label for="f-sub">Transporteur externe</label><select id="f-sub" class="in"></select></div>
          <div class="field hidden" id="f-sub-other-wrap"><label for="f-sub-other">Nom de la société</label><input id="f-sub-other" class="in" placeholder="Ex : Transport Bello"></div>
          <div class="field"><label for="f-ext-truck">Immatriculation</label><input id="f-ext-truck" class="in mono" placeholder="Ex : LT 123 AB"></div>
        </div>
        <div class="field"><label for="f-time">Heure de sortie</label><input id="f-time" class="in" type="time"></div>
      </div>

      <div class="group">
        <h3>Chauffeur</h3>
        <div id="f-drv-ymt">
          <div class="field"><label for="f-driver">Chauffeur au volant</label><select id="f-driver" class="in"></select></div>
          <div class="field hidden" id="f-driver-other-wrap"><label for="f-driver-other">Nom du chauffeur</label><input id="f-driver-other" class="in" placeholder="Prénom et nom"></div>
          <div id="f-exchange"></div>
        </div>
        <div id="f-drv-ext" class="hidden">
          <div class="field"><label for="f-ext-driver">Nom du chauffeur</label><input id="f-ext-driver" class="in" placeholder="Prénom et nom"></div>
        </div>
      </div>

      <div class="group">
        <h3>Conteneur</h3>
        <div class="field"><label for="f-ctn">N° conteneur</label><input id="f-ctn" class="in mono" placeholder="MSCU1234565" inputmode="text" autocapitalize="characters" maxlength="15"><div id="f-ctn-state" class="ctn-state"></div></div>
        <div class="field"><span class="lbl">Taille</span><div class="seg" id="f-size"><button type="button" data-v="20">20'</button><button type="button" data-v="40" class="on">40'</button><button type="button" data-v="45">45'</button></div></div>
        <div class="field"><label for="f-bl">N° BL</label><input id="f-bl" class="in mono" autocapitalize="characters"></div>
      </div>

      <div class="group">
        <h3>Livraison</h3>
        <div class="field"><label for="f-client">Client / destinataire</label><input id="f-client" class="in" list="dl-clients" autocapitalize="words"></div>
        <div class="field"><label for="f-dest">Destination</label><input id="f-dest" class="in" list="dl-dest" placeholder="Ex : Douala - Yaoundé" autocapitalize="words"></div>
      </div>

      <div class="group">
        <h3>Argent remis au chauffeur</h3>
        <div class="field"><label for="f-fuel">Carburant</label><div class="money-in"><input id="f-fuel" class="in" inputmode="numeric" placeholder="0"></div></div>
        <div class="field"><label for="f-adv">Avance</label><div class="money-in"><input id="f-adv" class="in" inputmode="numeric" placeholder="0"></div></div>
      </div>

      <div class="group">
        <h3>Observations</h3>
        <div class="field"><textarea id="f-obs" class="in" placeholder="Incident, retard, scellé, état du conteneur…"></textarea></div>
      </div>
      <button type="button" class="btn btn-danger hidden" id="f-delete">Supprimer cette ligne</button>
    </form>
  </main>
  <div class="form-dock"><div class="in2">
    <div class="row-2">
      <button class="btn btn-ghost" type="button" id="f-save-next">Enregistrer + autre</button>
      <button class="btn btn-amber" type="button" id="f-save">Enregistrer</button>
    </div>
  </div></div>
</section>

<datalist id="dl-clients"></datalist>
<datalist id="dl-dest"></datalist>
<datalist id="dl-ports"></datalist>

<script src="/port-print.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fcfa = n => (Number(n) || 0).toLocaleString('fr-FR').replace(/ | /g, ' ');
  const digits = v => parseInt(String(v || '').replace(/\D/g, ''), 10) || 0;
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const nowHM = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const dateLong = iso => new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const STATUS = { brouillon: 'Brouillon', soumis: 'Envoyée au bureau', valide: 'Validée' };
  const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };

  const S = { user: null, refs: null, sheets: [], sheet: null, editRow: null, owner: 0, size: '40' };

  // ── Réseau + file d'attente hors ligne ────────────────────────────────
  class NetErr extends Error {}
  async function api(method, url, body) {
    let r;
    try {
      r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' });
    } catch (e) { throw new NetErr('Pas de connexion'); }
    if (r.status === 401) { showLogin(); throw new Error('Session expirée — reconnectez-vous.'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Erreur ${r.status}`);
    return j;
  }
  const queue = () => LS.get('ymtp-queue', []);
  function setNet() {
    const q = queue().length;
    const on = navigator.onLine;
    ['net-home', 'net-sheet'].forEach(id => {
      const el = $(id);
      el.textContent = !on ? (q ? `Hors ligne · ${q} en attente` : 'Hors ligne') : (q ? `${q} à envoyer…` : 'En ligne');
      el.classList.toggle('off', !on || q > 0);
    });
  }
  let flushing = false;
  async function flush() {
    if (flushing || !navigator.onLine) return;
    const q = queue();
    if (!q.length) return setNet();
    flushing = true;
    const left = [];
    for (const item of q) {
      try { await api('POST', `/api/port/sheets/${item.sheetId}/rows`, item.payload); }
      catch (e) { if (e instanceof NetErr) { left.push(item); } else { toast(`Ligne non envoyée : ${e.message}`, true); } }
    }
    LS.set('ymtp-queue', left);
    flushing = false;
    setNet();
    if (left.length < q.length) {
      toast(`${q.length - left.length} sortie(s) envoyée(s) au bureau`);
      if (S.sheet) openSheet(S.sheet.id, true);
    }
  }
  window.addEventListener('online', () => { setNet(); flush(); });
  window.addEventListener('offline', setNet);
  setInterval(flush, 30000);

  // ── UI utilitaires ─────────────────────────────────────────────────────
  let toastT;
  function toast(msg, bad = false) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = document.createElement('div');
    t.className = 'toast' + (bad ? ' bad' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    clearTimeout(toastT);
    toastT = setTimeout(() => t.remove(), 3200);
  }
  function dialog(html) {
    const d = document.createElement('div');
    d.className = 'dialog';
    d.innerHTML = `<div class="box">${html}</div>`;
    d.addEventListener('click', e => { if (e.target === d) d.remove(); });
    document.body.appendChild(d);
    return d;
  }
  function confirmBox(title, text, okLabel, okClass = 'btn-navy') {
    return new Promise(res => {
      const d = dialog(`<h3>${title}</h3><p>${text}</p><div class="actions"><button class="btn ${okClass}" data-ok>${okLabel}</button><button class="btn btn-ghost" data-no>Annuler</button></div>`);
      d.querySelector('[data-ok]').onclick = () => { d.remove(); res(true); };
      d.querySelector('[data-no]').onclick = () => { d.remove(); res(false); };
    });
  }
  function show(view) {
    ['v-login', 'v-home', 'v-sheet'].forEach(v => $(v).classList.toggle('hidden', v !== view));
    window.scrollTo(0, 0);
  }

  // ── Contrôle conteneur ISO 6346 (hors ligne) ──────────────────────────
  const LV = (() => { const m = {}; let v = 10; for (const ch of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') { if (v % 11 === 0) v++; m[ch] = v++; } return m; })();
  function ctnCheck(raw) {
    const c = String(raw || '').toUpperCase().replace(/[\s\-_.]/g, '');
    if (!c) return { s: '', c };
    if (!/^[A-Z]{4}\d{7}$/.test(c)) return { s: c.length < 11 ? 'short' : 'format', c };
    let sum = 0;
    for (let i = 0; i < 10; i++) sum += (i < 4 ? LV[c[i]] : +c[i]) * Math.pow(2, i);
    return { s: (sum % 11) % 10 === +c[10] ? 'ok' : 'key', c, expect: (sum % 11) % 10 };
  }

  // ── Connexion ──────────────────────────────────────────────────────────
  function showLogin() { show('v-login'); setTimeout(() => $('lg-user').focus(), 50); }
  $('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    $('login-err').classList.add('hidden');
    try {
      const j = await api('POST', '/api/auth/login', { username: $('lg-user').value.trim(), password: $('lg-pass').value });
      S.user = j.user;
      $('lg-pass').value = '';
      boot();
    } catch (err) {
      $('login-err').textContent = err instanceof NetErr ? 'Pas de connexion internet.' : err.message;
      $('login-err').classList.remove('hidden');
    }
  });
  $('btn-logout').onclick = async () => {
    if (queue().length && !(await confirmBox('Sorties non envoyées', `${queue().length} sortie(s) attendent encore le réseau. Si vous vous déconnectez maintenant, elles restent sur ce téléphone et partiront à la prochaine connexion.`, 'Se déconnecter quand même', 'btn-danger'))) return;
    try { await api('POST', '/api/auth/logout'); } catch (_) {}
    S.user = null; showLogin();
  };

  // ── Démarrage ──────────────────────────────────────────────────────────
  async function boot() {
    setNet();
    try {
      const me = await fetch('/api/auth/me', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null);
      if (!me || !me.authenticated) { if (navigator.onLine) return showLogin(); }
      else { S.user = me.user; LS.set('ymtp-user', me.user); }
    } catch (_) { S.user = LS.get('ymtp-user', null); if (!S.user) return showLogin(); }
    await loadRefs();
    await home();
    flush();
  }

  async function loadRefs() {
    try { S.refs = await api('GET', '/api/port/refs'); LS.set('ymtp-refs', S.refs); }
    catch (_) { S.refs = LS.get('ymtp-refs', { trucks: [], drivers: [], subcontractors: [], clients: [], destinations: [], ports: [] }); }
    $('dl-clients').innerHTML = S.refs.clients.map(c => `<option value="${esc(c)}">`).join('');
    $('dl-dest').innerHTML = S.refs.destinations.map(c => `<option value="${esc(c)}">`).join('');
    $('dl-ports').innerHTML = ['Port Autonome de Douala', 'Terminal à conteneurs DIT', ...S.refs.ports].filter((v, i, a) => a.indexOf(v) === i).map(c => `<option value="${esc(c)}">`).join('');
    $('f-truck').innerHTML = `<option value="">— Choisir le camion —</option>` + S.refs.trucks.map(t => `<option value="${esc(t.code)}">${esc(t.code)} · ${esc(t.license_plate)}${t.habitual_driver ? ' · ' + esc(t.habitual_driver.split(' ')[0]) : ''}</option>`).join('');
    $('f-driver').innerHTML = `<option value="">— Choisir le chauffeur —</option>` + S.refs.drivers.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('') + `<option value="other">Autre chauffeur (saisir le nom)</option>`;
    $('f-sub').innerHTML = `<option value="">— Choisir le transporteur —</option>` + S.refs.subcontractors.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('') + `<option value="other">Autre société (saisir le nom)</option>`;
  }

  // ── Accueil ────────────────────────────────────────────────────────────
  async function home() {
    show('v-home');
    const h = new Date().getHours();
    $('home-hello').textContent = `${h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir'}, ${S.user?.username || ''}`;
    $('home-date').textContent = dateLong(todayISO());
    try { S.sheets = await api('GET', '/api/port/sheets'); LS.set('ymtp-sheets', S.sheets); }
    catch (_) { S.sheets = LS.get('ymtp-sheets', []); }

    if (todaySheet) {
      const t = todaySheet.totals || {};
      $('today-card').innerHTML = `<div class="card today">
        <div class="k">Fiche du jour · ${esc(todaySheet.sheet_no)}</div>
        <div class="big">${t.rows_total || 0} camion${(t.rows_total || 0) > 1 ? 's' : ''} sorti${(t.rows_total || 0) > 1 ? 's' : ''}</div>
        <div class="stats"><div><b>${t.containers || 0}</b><span>conteneurs</span></div><div><b>${fcfa(t.total_carburant)}</b><span>carburant</span></div><div><b>${fcfa(t.total_avance)}</b><span>avances</span></div></div>
        <button class="btn btn-amber" data-open="${todaySheet.id}">Continuer la fiche</button></div>`;
    } else {
      $('today-card').innerHTML = `<div class="card today">
        <div class="k">${esc(dateLong(todayISO()))}</div>
        <div class="big">Aucune fiche commencée aujourd'hui</div>
        <button class="btn btn-amber" id="btn-new-sheet"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Commencer la fiche du jour</button></div>`;
      $('btn-new-sheet').onclick = newSheetDialog;
    }
    const others = S.sheets.filter(s => s !== todaySheet).slice(0, 20);
    $('sheet-list').innerHTML = others.length ? others.map(s => `
      <button class="sheet-item" data-open="${s.id}">
        <div class="t"><b>${esc(dateLong(s.sheet_date))}</b><span>${esc(s.sheet_no)} · ${s.totals?.rows_total || 0} camion(s)</span></div>
        <span class="chip ${s.status}">${STATUS[s.status]}</span>
      </button>`).join('') : `<div class="empty"><p>Vos fiches envoyées apparaîtront ici.</p></div>`;
    document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openSheet(+b.dataset.open));
  }

  function newSheetDialog() {
    const last = S.sheets[0] || {};

      <div class="field"><label for="ns-port">Port / terminal</label><input id="ns-port" class="in" list="dl-ports" value="${esc(last.port || 'Port Autonome de Douala')}"></div>

    d.querySelector('[data-ok]').onclick = async () => {

  // ── Fiche ──────────────────────────────────────────────────────────────
  async function openSheet(id, silent = false) {
    try { S.sheet = await api('GET', `/api/port/sheets/${id}`); LS.set('ymtp-sheet-' + id, S.sheet); }
    catch (e) {
      S.sheet = LS.get('ymtp-sheet-' + id, null);
      if (!S.sheet) return toast(e.message, true);
      if (!silent) toast('Hors ligne : affichage de la dernière version');
    }
    renderSheet();
    if (!silent) show('v-sheet');
  }

  function renderSheet() {
    const s = S.sheet;
    const editable = s.status === 'brouillon';
    $('sh-title').textContent = dateLong(s.sheet_date);
    $('sh-sub').textContent = s.sheet_no;
    const pend = queue().filter(q => q.sheetId === s.id);
    const rows = [...s.rows, ...pend.map(p => ({ ...p.payload, _pending: true, driver_display: p.label }))];
    const tot = { n: rows.length, c: rows.filter(r => r.container_number).length, f: rows.reduce((a, r) => a + digits(r.carburant), 0), a: rows.reduce((a, r) => a + digits(r.avance), 0) };
    $('sh-summary').innerHTML = `<div><b>${tot.n}</b><span>camions</span></div><div><b>${tot.c}</b><span>conteneurs</span></div><div><b>${fcfa(tot.f)}</b><span>carburant</span></div><div><b>${fcfa(tot.a)}</b><span>avances</span></div>`;
    $('sh-status-note').innerHTML = s.status === 'soumis'
      ? `<div class="note info">Fiche envoyée au bureau${s.submitted_at ? ' le ' + esc(String(s.submitted_at).slice(0, 16).replace('T', ' ')) : ''}. Pour une correction, appelez le bureau.</div>`
      : s.status === 'valide' ? `<div class="note info">Fiche validée par le bureau${s.validated_by ? ' (' + esc(s.validated_by) + ')' : ''}.</div>`
      : (s.rows.length ? '' : `<div class="note info">Ajoutez chaque camion au moment où il sort. Le soir, touchez « Envoyer » pour transmettre la fiche au bureau.</div>`);
    $('sh-rows').innerHTML = rows.length ? rows.map((r, i) => {
      const ex = r.is_exchange || (!r.is_external && r.usual_driver_name);
      const ck = ctnCheck(r.container_number);
      const st = r.status === 'importe' ? '<span class="tag ok">Saisi au bureau</span>' : r.status === 'rejete' ? `<span class="tag no">Rejetée${r.reject_reason ? ' : ' + esc(r.reject_reason) : ''}</span>` : '';
      return `<button class="exit${r._pending ? ' pending' : ''}" ${!r._pending && editable ? `data-row="${r.id}"` : ''}>
        <div class="l1"><span class="time">${esc(r.exit_time || '--:--')}</span><span class="truck">${esc(r.matched_truck || r.truck_code || '—')}</span><span class="who">${esc(r.driver_display || r.driver_name || '')}</span></div>
        ${r.container_number ? `<div class="ctn">${esc(r.container_number)}${r.container_size ? ` · ${esc(r.container_size)}'` : ''}</div>` : ''}
        <div class="dest">${esc([r.client_name, r.destination].filter(Boolean).join(' → ') || 'Destination non précisée')}</div>
        <div class="money"><span>Carburant <b>${fcfa(r.carburant)}</b></span><span>Avance <b>${fcfa(r.avance)}</b></span></div>
        ${r._pending ? '<span class="tag ex">En attente de réseau</span>' : ''}
        ${r.is_external ? `<span class="tag ext">Externe${r.subcontractor_name || r.external_company ? ' · ' + esc(r.subcontractor_name || r.external_company) : ''}</span>` : ''}
        ${ex ? `<span class="tag ex">Échange · camion de ${esc(r.habitual_driver_name || r.usual_driver_name || '?')}</span>` : ''}
        ${st}
        ${!r._pending && (r.warnings || []).length && editable ? `<div class="warn">${r.warnings.map(esc).join('<br>')}</div>` : ''}
        ${r._pending && ck.s === 'key' ? '<div class="warn">Vérifier le numéro de conteneur</div>' : ''}
      </button>`;
    }).reverse().join('') : `<div class="empty"><svg viewBox="0 0 24 24"><rect x="1" y="6" width="15" height="11" rx="1"/><polygon points="16 10 20 10 23 13 23 17 16 17 16 10"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="18.5" r="2"/></svg><p>Aucun camion pour l'instant.<br>Touchez « Ajouter un camion » à chaque sortie.</p></div>`;
    document.querySelectorAll('[data-row]').forEach(b => b.onclick = () => openForm(s.rows.find(r => r.id === +b.dataset.row)));
    $('sh-dock').classList.toggle('hidden', !editable);
    $('btn-send').disabled = !s.rows.length;
    setNet();
  }

  $('btn-back').onclick = () => { S.sheet = null; home(); };
  $('btn-add').onclick = () => openForm(null);
  $('btn-send').onclick = async () => {
    const s = S.sheet;
    if (queue().some(q => q.sheetId === s.id)) return toast('Des sorties attendent encore le réseau. Patientez avant d\'envoyer.', true);
    const warn = s.rows.reduce((n, r) => n + (r.warnings || []).length, 0);
    const ok = await confirmBox('Envoyer la fiche au bureau ?',
      `${s.rows.length} camion(s), ${s.totals.containers} conteneur(s), ${fcfa(s.totals.total_carburant)} FCFA de carburant et ${fcfa(s.totals.total_avance)} FCFA d'avances.${warn ? `<br><br><b style="color:var(--amber-ink)">${warn} point(s) à vérifier</b> sont signalés en orange.` : ''}<br><br>Après l'envoi, vous ne pourrez plus modifier la fiche.`,
      'Envoyer au bureau');
    if (!ok) return;
    try { S.sheet = await api('POST', `/api/port/sheets/${s.id}/submit`); renderSheet(); toast('Fiche envoyée au bureau'); }
    catch (e) { toast(e instanceof NetErr ? 'Pas de réseau : réessayez dans un instant.' : e.message, true); }
  };
  $('btn-menu').onclick = () => {
    const s = S.sheet;
    const editable = s.status === 'brouillon';
    const d = dialog(`<div class="menu-list">
      <button data-a="print"><svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>PDF / Imprimer la fiche</button>
      ${editable ? `<button data-a="edit"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Port et téléphone</button>
      <button data-a="del" class="danger"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>Supprimer la fiche</button>` : ''}
      <button data-a="close"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Fermer</button></div>`);
    d.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
      d.remove();
      if (b.dataset.a === 'print') YMTPortPrint.open(S.sheet);
      if (b.dataset.a === 'edit') editHeader();
      if (b.dataset.a === 'del') {
        if (!(await confirmBox('Supprimer cette fiche ?', 'Toutes les sorties de la fiche seront effacées.', 'Supprimer', 'btn-danger'))) return;
        try { await api('DELETE', `/api/port/sheets/${S.sheet.id}`); toast('Fiche supprimée'); home(); } catch (e) { toast(e.message, true); }
      }
    });
  };
  function editHeader() {
    const s = S.sheet;
    const d = dialog(`<h3>Port et téléphone</h3>
      <div class="field"><label for="eh-port">Port / terminal</label><input id="eh-port" class="in" list="dl-ports" value="${esc(s.port || '')}"></div>
      <div class="field"><label for="eh-phone">Votre téléphone</label><input id="eh-phone" class="in" inputmode="tel" value="${esc(s.agent_phone || '')}"></div>
      <div class="actions"><button class="btn btn-amber" data-ok>Enregistrer</button><button class="btn btn-ghost" data-no>Annuler</button></div>`);
    d.querySelector('[data-no]').onclick = () => d.remove();
    d.querySelector('[data-ok]').onclick = async () => {

      catch (e) { toast(e.message, true); }

  // ── Formulaire d'une sortie ────────────────────────────────────────────
  function setSeg(id, v) { $(id).querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === String(v))); }
  $('f-owner').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.owner = +b.dataset.v; setSeg('f-owner', S.owner); applyOwner(); });
  $('f-size').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.size = b.dataset.v; setSeg('f-size', S.size); });
  function applyOwner() {
    const ext = S.owner === 1;
    ['f-ext', 'f-drv-ext'].forEach(id => $(id).classList.toggle('hidden', !ext));
    ['f-ymt', 'f-drv-ymt'].forEach(id => $(id).classList.toggle('hidden', ext));
  }
  $('f-sub').onchange = () => $('f-sub-other-wrap').classList.toggle('hidden', $('f-sub').value !== 'other');
  $('f-truck').onchange = () => {
    const t = S.refs.trucks.find(x => x.code === $('f-truck').value);
    if (t && t.habitual_driver_id && !S.driverTouched) $('f-driver').value = String(t.habitual_driver_id);
    updateExchange();
  };
  $('f-driver').onchange = () => { S.driverTouched = true; $('f-driver-other-wrap').classList.toggle('hidden', $('f-driver').value !== 'other'); updateExchange(); };
  function updateExchange() {
    const t = S.refs.trucks.find(x => x.code === $('f-truck').value);
    const dv = $('f-driver').value;
    const box = $('f-exchange');
    if (!t || !dv) { box.innerHTML = ''; return; }
    if (!t.habitual_driver_id) { box.innerHTML = `<div class="note info">Ce camion n'a pas de chauffeur habituel enregistré.</div>`; return; }
    if (dv !== String(t.habitual_driver_id)) {
      box.innerHTML = `<div class="note ex"><b>Échange de camion.</b> ${esc(t.code)} est le camion de <b>${esc(t.habitual_driver)}</b>. Le bureau le verra automatiquement.</div>`;
    } else box.innerHTML = '';
  }
  $('f-ctn').addEventListener('input', () => {
    const el = $('f-ctn');
    const pos = el.selectionStart;
    el.value = el.value.toUpperCase();
    el.setSelectionRange(pos, pos);
    const k = ctnCheck(el.value);
    const st = $('f-ctn-state');
    st.className = 'ctn-state ' + ({ ok: 'ok', key: 'bad', format: 'bad', short: 'warn' }[k.s] || '');
    st.textContent = { ok: 'Numéro valide', key: `Numéro douteux : le dernier chiffre devrait être ${k.expect}. Relisez le conteneur.`, format: 'Format attendu : 4 lettres puis 7 chiffres', short: `${k.c.length} / 11 caractères` }[k.s] || '';
  });
  ['f-fuel', 'f-adv'].forEach(id => $(id).addEventListener('input', e => {
    const n = digits(e.target.value);
    e.target.value = n ? fcfa(n) : '';
  }));

  function openForm(row) {
    S.editRow = row;
    S.driverTouched = !!row;
    $('row-form').reset();
    $('f-title').textContent = row ? 'Modifier la sortie' : 'Nouveau camion sorti';
    $('f-delete').classList.toggle('hidden', !row);
    $('f-ctn-state').textContent = '';
    $('f-exchange').innerHTML = '';
    S.owner = row && row.is_external ? 1 : 0; setSeg('f-owner', S.owner); applyOwner();
    S.size = row ? (row.container_size || '40') : '40'; setSeg('f-size', S.size);
    $('f-time').value = row ? (row.exit_time || '') : nowHM();
    $('f-sub-other-wrap').classList.add('hidden');
    $('f-driver-other-wrap').classList.add('hidden');
    if (row) {
      if (row.is_external) {
        $('f-sub').value = row.subcontractor_id ? String(row.subcontractor_id) : (row.external_company ? 'other' : '');
        if ($('f-sub').value === 'other') { $('f-sub-other-wrap').classList.remove('hidden'); $('f-sub-other').value = row.external_company || ''; }
        $('f-ext-truck').value = row.truck_code || '';
        $('f-ext-driver').value = row.driver_name || '';
      } else {
        $('f-truck').value = row.matched_truck || row.truck_code || '';
        if (row.driver_id) $('f-driver').value = String(row.driver_id);
        else if (row.driver_name) { $('f-driver').value = 'other'; $('f-driver-other-wrap').classList.remove('hidden'); $('f-driver-other').value = row.driver_name; }
        updateExchange();
      }
      $('f-ctn').value = row.container_number || ''; $('f-ctn').dispatchEvent(new Event('input'));
      $('f-bl').value = row.bl_number || '';
      $('f-client').value = row.client_name || '';
      $('f-dest').value = row.destination || '';
      $('f-fuel').value = row.carburant ? fcfa(row.carburant) : '';
      $('f-adv').value = row.avance ? fcfa(row.avance) : '';
      $('f-obs').value = row.observations || '';
    } else {
      // Reprendre la dernière destination / client pour aller plus vite
      const last = S.sheet.rows[S.sheet.rows.length - 1];
      if (last) { $('f-dest').value = last.destination || ''; }
    }
    $('v-form').classList.add('open');
    $('v-form').setAttribute('aria-hidden', 'false');
    $('v-form').scrollTop = 0;
  }
  function closeForm() { $('v-form').classList.remove('open'); $('v-form').setAttribute('aria-hidden', 'true'); }
  $('f-close').onclick = closeForm;

  function collect() {
    const ext = S.owner === 1;
    const p = {
      exit_time: $('f-time').value,
      is_external: ext,
      container_number: $('f-ctn').value.trim(),
      container_size: S.size,
      bl_number: $('f-bl').value.trim(),
      client_name: $('f-client').value.trim(),
      destination: $('f-dest').value.trim(),
      carburant: digits($('f-fuel').value),
      avance: digits($('f-adv').value),
      observations: $('f-obs').value.trim()
    };
    if (ext) {
      const sv = $('f-sub').value;
      p.subcontractor_id = sv && sv !== 'other' ? +sv : null;
      p.external_company = sv === 'other' ? $('f-sub-other').value.trim() : (S.refs.subcontractors.find(s => s.id === +sv)?.name || null);
      p.truck_code = $('f-ext-truck').value.trim();
      p.driver_name = $('f-ext-driver').value.trim();
      p.driver_id = null;
    } else {
      p.truck_code = $('f-truck').value;
      const dv = $('f-driver').value;
      p.driver_id = dv && dv !== 'other' ? +dv : null;
      p.driver_name = dv === 'other' ? $('f-driver-other').value.trim() : (S.refs.drivers.find(d => d.id === +dv)?.name || null);
      const t = S.refs.trucks.find(x => x.code === p.truck_code);
      p.usual_driver_name = t && t.habitual_driver && t.habitual_driver_id !== p.driver_id ? t.habitual_driver : null;
    }
    return p;
  }
  function validate(p) {
    if (!p.is_external && !p.truck_code) return 'Choisissez le camion.';
    if (p.is_external && !p.subcontractor_id && !p.external_company) return 'Indiquez le transporteur externe.';
    if (!p.is_external && !p.driver_id && !p.driver_name) return 'Choisissez le chauffeur.';
    if (!p.container_number) return 'Saisissez le numéro de conteneur.';
    if (!p.destination) return 'Indiquez la destination.';
    return null;
  }
  async function save(next) {
    const p = collect();
    const err = validate(p);
    if (err) return toast(err, true);
    const k = ctnCheck(p.container_number);
    if ((k.s === 'key' || k.s === 'format' || k.s === 'short') && !(await confirmBox('Numéro de conteneur douteux', `« ${esc(k.c)} » ne semble pas correct. Enregistrer quand même ?`, 'Oui, enregistrer', 'btn-amber'))) return;
    const btns = [$('f-save'), $('f-save-next')]; btns.forEach(b => b.disabled = true);
    try {
      if (S.editRow) S.sheet = await api('PUT', `/api/port/rows/${S.editRow.id}`, p);
      else { p.client_uid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); S.sheet = await api('POST', `/api/port/sheets/${S.sheet.id}/rows`, p); }
      LS.set('ymtp-sheet-' + S.sheet.id, S.sheet);
      toast(S.editRow ? 'Sortie modifiée' : 'Sortie enregistrée');
    } catch (e) {
      if (e instanceof NetErr && !S.editRow) {
        const q = queue();
        q.push({ sheetId: S.sheet.id, payload: p, label: p.driver_name || '' });
        LS.set('ymtp-queue', q);
        toast('Pas de réseau : enregistrée sur le téléphone, envoi automatique dès que possible');
      } else {
        btns.forEach(b => b.disabled = false);
        return toast(e instanceof NetErr ? 'Pas de réseau : la modification n\'a pas été envoyée.' : e.message, true);
      }
    }
    btns.forEach(b => b.disabled = false);
    renderSheet();
    if (next) openForm(null); else closeForm();
  }
  $('f-save').onclick = () => save(false);
  $('f-save-next').onclick = () => save(true);
  $('f-delete').onclick = async () => {
    if (!(await confirmBox('Supprimer cette sortie ?', 'La ligne sera retirée de la fiche.', 'Supprimer', 'btn-danger'))) return;
    try { S.sheet = await api('DELETE', `/api/port/rows/${S.editRow.id}`); closeForm(); renderSheet(); toast('Sortie supprimée'); }
    catch (e) { toast(e.message, true); }
  };

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/port-sw.js').catch(() => {});
  boot();
})();
</script>
</body>
</html>
